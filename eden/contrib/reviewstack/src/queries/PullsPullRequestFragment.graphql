fragment PullsPullRequestFragment on PullRequest {
  number
  title
  body @include(if: $includeBody)
  updatedAt
  author {
    ...ActorFragment
  }
  comments {
    totalCount
  }
  reviewDecision
  labels(first: 20, orderBy: {field: NAME, direction: ASC}) {
    nodes {
      ...LabelFragment
    }
  }
}
