query UserHomePageQuery($reviewRequestedQuery: String!) {
  viewer {
    pullRequests(first: 100, orderBy: {field: UPDATED_AT, direction: DESC}) {
      nodes {
        ...HomePagePullRequestFragment
      }
    }
  }
  search(first: 100, query: $reviewRequestedQuery, type: ISSUE) {
    nodes {
      ...HomePagePullRequestFragment
    }
  }
}
