fragment PullRequestReviewCommentFragment on PullRequestReviewComment {
  id
  author {
    ...ActorFragment
  }
  replyTo {
    id
  }
  body
  bodyHTML
  reactionGroups {
    content
    reactors {
      totalCount
    }
    viewerHasReacted
  }
  state
  outdated
  path
  originalCommit {
    oid
  }
  originalPosition
  commit {
    oid
  }
  position
}
